name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: satlab (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  rtl:
    name: rtl (SymbiYosys, WebAssembly toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yowasp-yosys==0.71.0.0.post1285" z3-solver
      - name: counter — bmc, prove, cover, bug (expected failure)
        working-directory: rtl/counter
        run: |
          for t in bmc prove cover bug; do
            yowasp-sby -f --yosys yowasp-yosys --smtbmc yowasp-yosys-smtbmc \
              --witness yowasp-yosys-witness counter.sby "$t"
          done
      - name: mul (w4, w8), fifo and arbiter (bmc, prove, cover)
        run: |
          SBY="yowasp-sby -f --yosys yowasp-yosys --smtbmc yowasp-yosys-smtbmc --witness yowasp-yosys-witness"
          (cd rtl/mul && for t in w4 w8; do $SBY mul.sby "$t"; done)
          (cd rtl/fifo && for t in bmc prove cover; do $SBY fifo.sby "$t"; done)
          (cd rtl/arbiter && for t in bmc prove cover; do $SBY arbiter.sby "$t"; done)

  lean:
    name: lean (lake build, course code, sv2lean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev,hdl,tutor,app]"
      - name: Install sv2v (SystemVerilog to Verilog, for Ibex)
        run: |
          curl -sSfL -o /tmp/sv2v.zip https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/sv2v.zip').extractall('/tmp/sv2v')"
          mkdir -p "$HOME/.local/bin" && install -m 755 /tmp/sv2v/sv2v-Linux/sv2v "$HOME/.local/bin/sv2v"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: lake build
      - name: No sorry in the library (exercises and the learner's exam files excluded)
        run: |
          ! grep -rn --include='*.lean' --exclude='Exercise.lean' -w sorry RtlProof \
            | grep -v '^RtlProof/Exam/Ibex/\(MultDiv\|LoadStore\)\.lean:'
      - name: Exercises and exam files compile (with their sorries)
        run: |
          for f in $(find RtlProof -name Exercise.lean) RtlProof/Exam/Ibex/MultDiv.lean RtlProof/Exam/Ibex/LoadStore.lean; do
            lake env lean "$f"
          done
      - name: Course code compiles (LEAN_FLUENCY.md, CAPSTONE_EXAM_PREP.md)
        run: |
          python3 tools/lean_blocks.py docs/LEAN_FLUENCY.md
          python3 tools/lean_blocks.py docs/CAPSTONE_EXAM_PREP.md
      - name: Ibex exam - reference solutions score 100, statements untouched
        run: pvs-exam --reference
      - name: Ibex exam - the challenge statement holds on 400 random cases
        run: lake env lean capstone/exam/simcheck.lean | tee /dev/stderr | grep -qx '(0, 400)'
      - name: sv2lean, ftwin, tutor-tool, web-app and grader tests (difftests, mutation tests, twin report, API)
        run: pytest -q tests/sv2lean tests/ftwin tests/tutor tests/app tests/exam
      - name: Generated models are up to date
        run: |
          sv2lean rtl/counter/counter.sv --top counter --namespace Gen.Counter \
            -o RtlProof/Generated/Counter.lean
          sv2lean rtl/mul/mul.sv --top mul -P W=8 --namespace Gen.Mul8 \
            -o RtlProof/Generated/Mul8.lean
          sv2lean rtl/fifo/fifo.sv --top fifo -P AW=2 -P DW=4 --namespace Gen.Fifo4 \
            -o RtlProof/Generated/Fifo4.lean
          sv2lean rtl/arbiter/arbiter.sv --top arbiter -P K=2 --namespace Gen.Arbiter4 \
            -o RtlProof/Generated/Arbiter4.lean
          capstone/ibex/generate.sh
          git diff --exit-code RtlProof/Generated
