[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-vs-search"
version = "0.1.0"
description = "Learning lab: Lean 4 theorem proving vs. SAT-based model checking for RTL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-sat>=1.9.dev24",   # MiniSat, Glucose, CaDiCaL, Kissat, Lingeling, Maple* bindings
  "z3-solver>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# WebAssembly builds of Yosys + SymbiYosys; enough for smtbmc tasks.
# ABC-based engines (abc pdr) need the native OSS CAD Suite instead.
hdl = ["yowasp-yosys"]

[project.scripts]
satlab = "satlab.cli:main"

[tool.setuptools.packages.find]
include = ["satlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
