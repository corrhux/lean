[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-vs-search"
version = "0.1.0"
description = "Learning lab: Lean 4 theorem proving vs. SAT-based model checking for RTL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-sat>=1.9.dev24",   # MiniSat, Glucose, CaDiCaL, Kissat, Lingeling, Maple* bindings
  "z3-solver>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The AI tutor (needs ANTHROPIC_API_KEY or an `ant auth login` profile)
tutor = ["anthropic>=2.12"]
# The local web app (Phase 2)
app = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]   # httpx: FastAPI TestClient
# WebAssembly builds of Yosys + SymbiYosys; enough for smtbmc tasks.
# ABC-based engines (abc pdr) need the native OSS CAD Suite instead.
hdl = ["yowasp-yosys==0.71.0.0.post1285"]

[project.scripts]
satlab = "satlab.cli:main"
sv2lean = "sv2lean.__main__:main"
ftwin = "ftwin.__main__:main"
tutor = "tutor.__main__:main"
pvs-app = "app.backend.main:main"
pvs-exam = "pvs_exam.__main__:main"

[tool.setuptools.packages.find]
where = [".", "tools"]
include = ["satlab*", "sv2lean*", "ftwin*", "tutor*", "app*", "pvs_exam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
app = ["frontend/*"]
